- id: ty-title-names-product
  check: title_lacks_product
  decision: abstain
  params: {}
  scope: domain
  domains: [toys]
  status: proposal
  description: Ask for review when the candidate product name is not supported by the title.
  origin: existing shared check; toys bootstrap proposal
  evidence: Source contains numbered products and thin titles; this shared lexical check does not protect numeric identity and has not been measured on toys gold.
- id: ty-model-set-number
  check: toys_identifier_evidence
  decision: abstain
  params: {}
  scope: domain
  domains: [toys]
  status: proposal
  description: Compare explicitly evidenced set/model identifiers without dropping numerals; a conflicting or missing identifier must block automatic placement on that numbered product.
  origin: observed Amazon building sets and RC titles
  evidence: Numeric set numbers and alphanumeric RC models occur in RAW; taxo.tools.toys.identifier_evidence is implemented locally but requires shared check registration, catalogue-backed candidate fields and human gold before enabling.
- id: ty-accessory-variant-evidence
  check: toys_offering_evidence
  decision: abstain
  params: {}
  scope: domain
  domains: [toys]
  status: proposal
  description: Block automatic complete-toy or exact-variant placement for an accessory-only or assorted/random offer without explicit supporting evidence.
  origin: observed Amazon compatibility and assorted offers
  evidence: Display stands, replacement RC components and random colors occur in RAW; taxo.tools.toys.offering_evidence is implemented locally but requires shared check registration, candidate offering/variant fields and gold evaluation before enabling.
