id: food/route-missing-source-brand
stage: route
when:
  - {fact: brand.slug, missing: true}
  - {fact: placement.level, eq: none}
then: {route: agent_evidence}
status: shadow
why: >-
  Missing source brands leave food observations without a path. Route these to
  supplied title/description evidence without inferring a brand from the seller
  or importing Pedia assignments. One isolated bounded construction exercised
  this route; path agreement was neutral and no agent placement calls were made.
  Owner-confirmed Food gold permits offline scoring; admission still needs a
  valid Food gate and demonstrated placement or cost benefit. The route-only
  experiment is neutral on saved placements and remains shadow.
