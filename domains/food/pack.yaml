name: food
families: [consumer_packaged]       # family rules shared with fragrance (count, measure, bundle structure)
levels: [brand, line, product, variant, pack]
data: food/                          # under TAXO_DATA_DIR
truth: owner-confirmed Food Pedia human gold; verify exact source joins; labels stay outside Git
conventions: |
  - Pack count and weight/volume are buying choices on the product, never identity nodes.
  - A flavour or colour is a variant; a different format or form is a separate product.
  - The title must name the child: a marketplace option alone cannot move a listing to a variant.
  - Shops are not brands (own-label is); a licensed product sits on the brand printed on the pack.
