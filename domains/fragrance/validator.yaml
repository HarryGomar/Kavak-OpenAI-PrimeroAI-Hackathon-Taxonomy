# Validator setup v1 (fragrance). The validator works a LINE OF QUESTIONS, in order; each names the tools that answer
# it (taxo/roles/validator.py: similar_brands, ask_person, web_search, and domains/<d>/validator_tools.py). Questions
# are proposals until the validator scores better on gold with them. The improver proposes questions and tools.
# v1 is seeded with two questions translated from the prompt-only card (taxo/validator.py before the merge), which
# scored 82.5% exact vs the reviewer on Loop B V3. With no questions the agent named no tools and answered generic
# paths. The improver adds, rewords or branches questions from here, each kept only if it wins an A/B on human labels.
# EXAMPLES of questions the improver might induce (not active):
#   - id: who_makes_it
#     ask: Which house makes this? Is the brand field a seller, a store label or an "inspired by" house?
#     tools: [similar_brands, web_search]
#     then: If two houses fit, web-search both; if still unsure, ask_person.
#     status: proposal
#     origin: Pedia brand/alias-lookup, brand/inspired-by-mask (dupes name the house they imitate)
#   - id: official_name
#     ask: What is the scent's official name on the brand's site or a fragrance catalogue?
#     tools: [web_search]
#     then: Place on the official name, not the seller's wording.
#     status: proposal
#     origin: Pedia registry (official lines) and SPEC agent_search route
#   - id: concentration_and_audience
#     ask: What concentration (EDT, EDP, parfum, extrait) and audience (men, women) does the listing state?
#     then: Reject a path with a different one.
#     status: proposal
#     origin: Pedia DIM_OFFICIAL_MISMATCH flag; checks concentration_conflict, audience_conflict
#   - id: set_or_form
#     ask: Is this a gift set, body mist, lotion or oil rather than the scent itself?
#     then: If so, place it on that set or form child, not on the scent.
#     status: proposal
#     origin: Pedia SET_PIECES_UNNAMED; Harry v6 forms 38:1
version: 3
model: gpt-6-luna
web: true
use_proposals: false
inputs:
- title
- brand_field
- seller
- concentration
- volume_ml
- gender
questions:
- id: who_makes_it
  ask: Which house makes this? Start from the brand given; check that the title, the shop and the URL agree with it.
  tools:
  - similar_brands
  then: Keep the brand given unless the title clearly names another known house. Put the brand first in the path.
  status: admitted
  origin: seeded from the prompt-only card (Loop B V3, 82.5% exact)
- id: product_name
  ask: What named fragrance or set does the listing identify? Use the title to identify the complete named item, and use the
    brand’s product list to check its name and parent line. Do not treat a catalog match for a shorter phrase as proof that
    the listing names that phrase as a separate product or line; when the title and catalog do not establish a hierarchy,
    use the most specific name the title supports without inventing a parent.
  tools:
  - brand_products
  then: null
  status: admitted
  origin: 'improver fit F2 round 5: The product_name traces went wrong when a catalog match or web result was treated as establishing
    a deeper product hierarchy than the title supports, including '
