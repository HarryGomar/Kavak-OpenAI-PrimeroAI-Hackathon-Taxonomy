- id: preserve_product_name_tokens
  statement: Words like body mist, hair mist, body spray, travel spray and gift set stay in the product's name when the
    title uses them as part of that name; they are dropped only when they merely describe the form or the packaging.
  example: {title: "Saltair Coral Coast Body Mist 8 fl oz", path: [Saltair, Coral Coast, Coral Coast Body Mist]}
  question_id: preserve_product_name_tokens
