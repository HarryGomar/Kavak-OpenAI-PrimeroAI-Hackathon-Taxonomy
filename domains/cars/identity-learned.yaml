- id: Normalize Kia Soul with embedded EX trim
  round: 3
  kept_at: '2026-11-09'
  origin: codex proposer
  source: codex proposer
  why: The Kia Soul EX listing incorrectly creates the nameplate 'soul ex'. A Kia-specific alias maps this trim-bearing nameplate
    to 'soul' without affecting other makes.
  ops:
  - op: add_alias
    path: models.aliases.kia
    value: soul ex=soul
  dev:
    holds: 168
    n: 194
    harm: 11
    routed: 5790
    version_nodes: 5160
  delta:
    holds: 1
    harm: 0
    routed: -2
    version_nodes: 1
  sealed:
    rows: 34
    before: 23
    after: 23
    harm: 6
    reads_total: 5
- id: Restore JAC nameplate after make-prefix stripping
  round: 3
  kept_at: '2026-11-09'
  origin: codex proposer
  source: codex proposer
  why: The listing explicitly names 'Jac 2', but normalization reduces it to '2'. A JAC-scoped alias restores the nameplate
    without affecting numeric models of other makes.
  ops:
  - op: add_alias
    path: models.aliases.jac
    value: 2=jac 2
