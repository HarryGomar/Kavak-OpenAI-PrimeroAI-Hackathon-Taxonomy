  kept_at: '2026-11-09'
  origin: queued (human review)
  source: owner review r01 (Yaris 1.5 S MT, Kia Rio 1.6 EX Manual)
  why: The owner names the gearbox in the version; add it from the listing's transmission field when the trim text lacks it.
  ops:
