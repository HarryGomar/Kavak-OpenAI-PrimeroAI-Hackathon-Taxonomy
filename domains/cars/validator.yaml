# Validator setup v1 (cars). A line of questions, each with the tools that answer it; proposals until the validator
# scores better on gold with them.
version: 1
model: gpt-6-luna
web: true
use_proposals: false
inputs: [title, make, model, version, year, km, price]
# Starts empty: the improver induces questions from the validator's mistakes on our labels.
questions: []

