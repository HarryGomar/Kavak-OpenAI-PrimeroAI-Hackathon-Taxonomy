# Cars vocabulary: tokens that are variants (trim, gearbox, drivetrain, fuel, doors), body-type words, and the body
# categories. Body type is a browse category, never part of identity. Ported from the Taxonomy repo
# scopes/cars/{identity-rules,source-categories,taxonomy}.yaml @0.2.0.
schema_version: 1
domain: cars
version: 0.2.0
trim:
  generic_tokens: [aut, at, automatico, automatica, auto, std, mt, man, manual, cvt, dct, dsg, tiptronic, steptronic, tip, l, t, 4p, 5p, 2p, 3p, 4x2, 4x4, awd, fwd, rwd, gasolina, turbo]
dimensions:
  displacement: '(?<![\d.])([0-9])\.([0-9])(?:\s?l\b|\b|t\b)'
  cylinders: '\b([lv])(3|4|5|6|8|10|12)\b'
  turbo: '\b(?:turbo|tsi|tfsi|tgdi|t-gdi|ecoboost)\b|\b\d\.\dt\b|/t\b'
  transmission:
    automatic: '\b(?:aut|at|auto|automatico|automatica|automatic|tiptronic|tip|steptronic|secuencial)\b'
    cvt: '\b(?:cvt|ivt|e-cvt|xtronic)\b'
    dct: '\b(?:dct|dsg|s tronic|edc|pdk)\b'
    manual: '\b(?:std|mt|man|manual|estandar)\b'
  drivetrain:
    4x4: '\b(?:4x4|4wd)\b'
    awd: '\b(?:awd|quattro|4matic|xdrive|4motion|all4)\b'
    4x2: '\b(?:4x2)\b'
  fuel:
    hybrid: '\b(?:hev|hibrido|hibrida|hybrid|e-power|mhev)\b'
    plug_in_hybrid: '\b(?:phev|plug-in)\b'
    electric: '\b(?:ev|electrico|electric)\b'
    diesel: '\b(?:diesel|tdi|crdi)\b'
  doors: '\b([2-5])\s?p(?:tas|uertas)?\b'

bodies:
  aliases:
    sedan: vehicles.car.sedan
    sedán: vehicles.car.sedan
    hatchback: vehicles.car.hatchback
    hatchback (5 puertas): vehicles.car.hatchback
    hatchback (3 puertas): vehicles.car.hatchback
    hb: vehicles.car.hatchback
    coupe: vehicles.car.coupe
    coupé: vehicles.car.coupe
    convertible: vehicles.car.convertible
    cabriolet: vehicles.car.convertible
    roadster: vehicles.car.convertible
    station wagon: vehicles.car.wagon
    wagon: vehicles.car.wagon
    suv: vehicles.suv
    camioneta suv: vehicles.suv
    crossover: vehicles.suv
    pickup: vehicles.pickup
    pick up: vehicles.pickup
    pick-up: vehicles.pickup
    camioneta pickup: vehicles.pickup
    van: vehicles.van.cargo
    minivan: vehicles.van.minivan
    mini-van: vehicles.van.minivan
    chasis: vehicles.commercial
    chasis cabina: vehicles.commercial
  ignore: ['', 'n/a', 'sin definir', '$undefined', limousine, otro]
  title_rules:
    - {id: body/title-sedan, category: vehicles.car.sedan, any: ['\bsed[aá]n\b']}
    - {id: body/title-hatchback, category: vehicles.car.hatchback, any: ['\bhatchback\b', '\bhb\b']}
    - {id: body/title-coupe, category: vehicles.car.coupe, any: ['\bcoup[eé]\b']}
    - {id: body/title-convertible, category: vehicles.car.convertible, any: ['\bconvertible\b', '\bcabrio(?:let)?\b', '\broadster\b']}
    - {id: body/title-pickup, category: vehicles.pickup, any: ['\bpick ?-?up\b', '\bdoble cabina\b', '\bcabina (?:regular|sencilla|extendida)\b', '\bcrew cab\b']}
    - {id: body/title-chasis, category: vehicles.commercial, any: ['\bchasis\b']}
    - {id: body/title-minivan, category: vehicles.van.minivan, any: ['\bminivan\b']}
categories:
  - {id: vehicles, label: Vehicles, parent: null}
  - {id: vehicles.car, label: Cars, parent: vehicles}
  - {id: vehicles.car.sedan, label: Sedans, parent: vehicles.car}
  - {id: vehicles.car.hatchback, label: Hatchbacks, parent: vehicles.car}
  - {id: vehicles.car.coupe, label: Coupes, parent: vehicles.car}
  - {id: vehicles.car.convertible, label: Convertibles, parent: vehicles.car}
  - {id: vehicles.car.wagon, label: Station wagons, parent: vehicles.car}
  - {id: vehicles.suv, label: SUVs and crossovers, parent: vehicles}
  - {id: vehicles.pickup, label: Pickups, parent: vehicles}
  - {id: vehicles.van, label: Vans, parent: vehicles}
  - {id: vehicles.van.minivan, label: Minivans, parent: vehicles.van}
  - {id: vehicles.van.cargo, label: Cargo and passenger vans, parent: vehicles.van}
  - {id: vehicles.commercial, label: Chassis and commercial, parent: vehicles}
