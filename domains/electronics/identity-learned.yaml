- name: allow_three_character_models
  ops:
  - op: set
    path: model.min_key_length
    value: 3
  rationale: The four-character minimum excludes short manufacturer models such as
    H17, causing identical products to fall back to differing source-field identifiers.
  expected_effect: Both Motorola H17 listings should resolve to h17. Existing numeric
    and specification-token exclusions remain active to limit false merges.
  proposed_by: codex
