- name: reject_component_count_specs
  ops:
  - op: append
    path: model.not_model_tokens
    value: ^(?:\d+mos|\d+-sections?)$
  rationale: 'The rules mistake count specifications for models: ''3mos'' on a Panasonic
    camcorder and ''4-section'' on a Digipower tripod. Reject these generic token
    families.'
  expected_effect: Removes misleading model candidates, allowing another supported
    identifier or an unresolved model, without broadening model equivalence rules.
  proposed_by: codex
