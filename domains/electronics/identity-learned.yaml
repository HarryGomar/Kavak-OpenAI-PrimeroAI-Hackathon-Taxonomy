# Rule edits proposed by the Codex proposer and decided by the gate (loop.gate_cfgs).
# Only status: kept is applied (graph.load_cfg). Written by code, never by hand.
changes:
- name: prefer_source_model_fields
  ops:
  - op: set
    path: model.field_confirm_in_own_text
    value: false
  rationale: XM and Polaroid false splits share identical model fields but select
    different title identifiers. Requiring title confirmation causes inconsistent
    model selection.
  expected_effect: Reunite those pairs through their shared source fields and reduce
    title-driven false merges such as HP ce250a versus ce-250x, without adding broader
    equivalence rules.
  proposed_by: codex
