- name: tighten_sibling_suffix_aliasing
  ops:
  - op: set
    path: model.sibling_suffix_max
    value: 0
  rationale: Repeated Panasonic false merges collapse distinct suffix-bearing identifiers
    to dmc-fh5. Disabling the generic sibling-suffix allowance targets this overmerging
    conservatively.
  expected_effect: May reduce short-suffix false merges without adding equivalences.
    Genuine suffix aliases may split; explicit color-code aliases may remain unaffected.
  proposed_by: codex
