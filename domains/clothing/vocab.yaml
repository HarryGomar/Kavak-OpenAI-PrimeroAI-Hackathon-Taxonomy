# Conservative bootstrap vocabulary, proposed from source patterns; no human validation.
# Empty stripping is deliberate: US sizes, ages, 874 and G1100 cannot be separated safely by a token list.
variant: {}
strip: []
size_pattern: '(?!)'
preserve_identity_tokens: true
bind: [of, the, and, for]
settings:
  support_floor: 2
  max_units: 64
observed_attributes:
  garment: [t-shirt, dress, pants, shorts, bra, socks, swimsuit, hoodie]
  cut: [wide leg, straight fit, bootcut, slim fit, high waisted, oversized]
  colour_pattern: [black, blue, red, floral, striped, gingham]
  material: [cotton, linen, polyester, wool, viscose]
  audience: [women, men, girls, boys, baby, toddler, maternity, unisex]
  size_system: [US, UK, EU, petite, plus size, big and tall, months, years]
  offer: [multipack, pack of, pairs, piece set]
