name: clothing
families: [garments]
levels: [brand, product, variant]
data: clothing/subset-1/
taxonomy_source: optional external nodes; absent means raw-only bootstrap
truth: none; no human gold supplied
checks_module: taxo.tools.clothing
construction:
  brand_policy: source_field_only
  full_title: true
  variant_axes: []
  global_evaluator_rules: false
conventions: |
  Scope is human garments, including underwear, hosiery, swimwear and coordinated clothing sets.
  Separate footwear, bags, jewelry, detached garment accessories and doll clothes are outside scope.
  Seller, store, licensed character and compatible-with wording do not establish a maker.
  Source brand is an unverified reported brand, not an official maker registry.
  Preserve style/model codes and meaningful numerals, including codes made only of digits.
  Size and pack count are listing attributes, never nodes (SPEC); do not strip bare numerals or age ranges.
  Proposed convention: cut, material, audience and graphic design may distinguish products; do not erase them blindly.
  Proposed convention: a coordinated outfit is distinct from a multipack of one garment; 2-in-1 is not a pack count.
  Colours and patterns require product evidence before being treated as variants.
