- id: cl-maker-evidence
  text: Treat the reported brand as source evidence; never infer the maker from a seller, licensed graphic, or compatible-with wording, and abstain when maker identity is unresolved.
  origin: task constraints and clothing RAW sidecar inspection
  evidence: 'Refreshed RAW f3a47a08 has 1964 rows with differing nonempty brand and merchant; machine profile, not human gold.'
  status: proposal
- id: cl-preserve-style-and-cut
  text: Keep style and model codes, numerals, garment type, cut and named designs; distinguish age and size evidence before removing any token, and require evidence before merging colour or material variants.
  origin: clothing source-pattern inspection
  evidence: 'G1100, G64000, Og35063 and 874 occur in source titles; no human identity labels supplied.'
  status: proposal
- id: cl-garments-and-sets
  text: Clothing graphics stay in clothing; exclude separate footwear and accessories, keep coordinated sets distinct from repeated garments, and never interpret 2-in-1 construction as two sale units.
  origin: task scope and RAW title/rank evidence
  evidence: 'Running shorts, graphic shirts, multipacks and two-piece lounge sets observed; proposed semantics, not gold.'
  status: proposal
