[project]
name = "taxo"
version = "0.1.0"
description = "Scalable judgment: place listings into a taxonomy across domains, with a shared memory of rules that earn their place."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4",
    "pyarrow>=26.0.1",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taxo", "domains"]

[tool.pytest.ini_options]
testpaths = ["tests"]
